<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공키우기 시안 - 필드 · 골대 · 키퍼 (스타일 F)</title>
<style>
  body { margin: 0; background: #14161c; color: #e8eaf0; font: 15px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { padding: 24px 24px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0 0 4px; color: #9aa3b5; }
  a { color: #7cb3ff; }
  .wrap { display: flex; gap: 24px; padding: 8px 24px 24px; flex-wrap: wrap; align-items: flex-start; }
  .controls { width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .group h3 { margin: 0 0 6px; font-size: 14px; color: #f59e0b; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts button { background: #232734; color: #e8eaf0; border: 1px solid #3a4054; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .opts button[aria-pressed="true"] { background: #3b82f6; border-color: #3b82f6; }
  .hint { color: #9aa3b5; font-size: 13px; }
  .stageBox { display: flex; gap: 24px; flex-wrap: wrap; }
  .scene { position: relative; overflow: hidden; background: #000; }
  .mobile { width: 375px; aspect-ratio: 9 / 16; border-radius: 16px; }
  .pc { width: 640px; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; display: flex; justify-content: center; background: #0b0d12; }
  .pc .col { position: relative; height: 100%; aspect-ratio: 9 / 16; overflow: hidden; }
  .pc .side { flex: 1; background: repeating-linear-gradient(45deg, #0f121a 0 12px, #141824 12px 24px); }
  body.view-pc .mobile, body:not(.view-pc) .pc { display: none; }
  .layer { position: absolute; image-rendering: pixelated; }
  .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gridwrap { padding: 0 24px 40px; }
  .gridwrap h2 { margin: 24px 0 8px; font-size: 18px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .card { background: #1c202b; border: 1px solid #2c3244; border-radius: 10px; padding: 10px; }
  .card figcaption { margin-top: 6px; text-align: center; color: #9aa3b5; font-size: 13px; }
  .card img { display: block; image-rendering: pixelated; }
  .card.bgc img { width: 220px; border-radius: 8px; }
  .card.goalc, .card.keeperc { background: #3f6b3f; }
  .card.goalc img { width: 260px; }
  .card.keeperc img { height: 130px; }
  .keeper-row { display: flex; gap: 8px; align-items: flex-end; }
  .tabs { display: flex; gap: 8px; padding: 12px 24px 0; }
  .tabs button { background: #232734; color: #e8eaf0; border: 1px solid #3a4054; border-radius: 8px; padding: 8px 16px; cursor: pointer; font: inherit; }
  .tabs button[aria-pressed="true"] { background: #3b82f6; border-color: #3b82f6; }
</style>
</head>
<body>
<header>
  <h1>필드 · 골대 · 키퍼 시안 · 스타일 F</h1>
  <p>배경, 골대, 키퍼를 골라 게임 화면처럼 겹쳐 볼 수 있습니다. 키퍼 포즈 버튼으로 대기 · 왼쪽 · 오른쪽 · 점프를 확인하세요. <a href="index.html">스타일 보드</a> · <a href="frames.html">프레임</a></p>
</header>
<div class="tabs">
  <button id="t-m" aria-pressed="true">모바일 375px</button>
  <button id="t-p" aria-pressed="false">PC 16:9</button>
</div>
<div class="wrap">
  <div class="controls">
    <div class="group"><h3>배경</h3><div class="opts" id="o-bg"></div><div class="hint" id="d-bg"></div></div>
    <div class="group"><h3>골대</h3><div class="opts" id="o-goal"></div><div class="hint" id="d-goal"></div></div>
    <div class="group"><h3>키퍼</h3><div class="opts" id="o-keeper"></div><div class="hint" id="d-keeper"></div></div>
    <div class="group"><h3>키퍼 포즈</h3><div class="opts" id="o-pose"></div></div>
  </div>
  <div class="stageBox">
    <div class="scene mobile" id="s-m"></div>
    <div class="pc"><div class="side"></div><div class="col scene" id="s-p"></div><div class="side"></div></div>
  </div>
</div>
<div class="gridwrap" id="grid"></div>
<script>
  const DESC = {
    bg: { A: "가을 석양 · 울타리, 단풍 나무", B: "맑은 봄날 · 푸른 하늘, 빨랫줄", C: "비 갠 저녁 · 물웅덩이, 가로등" },
    goal: { A: "나무 골대 + 밧줄 그물", B: "흰색 골대 + 촘촘한 그물", C: "녹슨 금속 골대 + 기운 그물" },
    keeper: { A: "꼬마 키퍼 (빨간 줄무늬 유니폼)", B: "콧수염 아저씨 (파란 유니폼, 모자)", C: "통통한 마스코트 (노란 유니폼)" },
  };
  // 키퍼별 다이빙 이미지: left/right 는 파일 이름과 반전 여부. B 는 둘 다 오른쪽을 향해 나와서 왼쪽은 반전해서 쓴다.
  const DIVE = {
    A: { left: ["dive_a", false], right: ["dive_b", false] },
    B: { left: ["dive_a", true], right: ["dive_b", false] },
    C: { left: ["dive_a", false], right: ["dive_b", false] },
  };
  const POSES = [["ready", "대기"], ["left", "왼쪽 다이빙"], ["right", "오른쪽 다이빙"], ["jump", "점프"]];
  const state = { bg: "A", goal: "A", keeper: "A", pose: "ready" };
  const sizes = {};
  const file = (k, n) => `field/keeper_${k}_${n}.png`;

  function opts(id, keys, key) {
    const el = document.getElementById("o-" + id);
    el.innerHTML = keys.map(([k, t]) => `<button data-k="${k}" aria-pressed="${state[key] === k}">${t}</button>`).join("");
    el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.k; render(); };
  }

  function layerHTML() {
    const k = state.keeper;
    let pose = state.pose, flip = false, name = "ready";
    if (pose === "left" || pose === "right") { [name, flip] = DIVE[k][pose]; } else if (pose === "jump") name = "jump";
    const sz = sizes[k + name];
    // 기준: 대기 포즈 높이를 장면 폭의 19%로 두고, 다른 포즈도 같은 비율로 그린다 (같은 시트에서 나온 크기)
    const ready = sizes[k + "ready"];
    const unit = ready ? 0.19 / ready.h : 0;
    const w = sz ? sz.w * unit * 100 : 20, h = sz ? sz.h * unit * 100 : 20;
    // 장면 폭 대비 퍼센트. 높이를 같은 단위로 맞추기 위해 aspect-ratio 사용
    const goalLeft = 8, goalW = 84;
    const goalTop = 27;
    const x = pose === "left" ? 28 : pose === "right" ? 72 : 50;
    const keeperBottomFromGoalTop = 56; // 골대 아랫면 근처 (골대 상단으로부터 장면 폭 기준 %)
    const jumpLift = pose === "jump" ? 4 : pose === "ready" ? 0 : -2;
    return `
      <img class="layer bg" src="field/bg_${state.bg}.png" alt="">
      <img class="layer goal" src="field/goal_${state.goal}.png" alt="" style="left:${goalLeft}%;width:${goalW}%;top:${goalTop}%">
      <img class="layer keeper" src="${file(k, name)}" alt="" style="left:${x}%;width:${w}%;top:calc(${goalTop}% + ${keeperBottomFromGoalTop}cqw - ${h}cqw + ${(-jumpLift)}cqw);transform:translateX(-50%) ${flip ? "scaleX(-1)" : ""}">
    `;
  }

  function render() {
    opts("bg", [["A", "A"], ["B", "B"], ["C", "C"]], "bg");
    opts("goal", [["A", "A"], ["B", "B"], ["C", "C"]], "goal");
    opts("keeper", [["A", "A"], ["B", "B"], ["C", "C"]], "keeper");
    opts("pose", POSES, "pose");
    for (const g of ["bg", "goal", "keeper"]) document.getElementById("d-" + g).textContent = DESC[g][state[g]];
    for (const id of ["s-m", "s-p"]) {
      const el = document.getElementById(id);
      el.style.containerType = "inline-size";
      el.innerHTML = layerHTML();
    }
  }

  function loadSizes() {
    const jobs = [];
    for (const k of "ABC") for (const n of ["ready", "dive_a", "dive_b", "jump"]) {
      jobs.push(new Promise((res) => { const im = new Image(); im.onload = () => { sizes[k + n] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.src = file(k, n); }));
    }
    return Promise.all(jobs);
  }

  function grid() {
    const g = document.getElementById("grid");
    g.innerHTML = `
      <h2>배경 3안</h2><div class="row">${["A", "B", "C"].map((k) => `<figure class="card bgc" style="margin:0"><img src="field/bg_${k}.png"><figcaption>${k} · ${DESC.bg[k]}</figcaption></figure>`).join("")}</div>
      <h2>골대 3안 (그물 안쪽은 투명)</h2><div class="row">${["A", "B", "C"].map((k) => `<figure class="card goalc" style="margin:0"><img src="field/goal_${k}.png"><figcaption>${k} · ${DESC.goal[k]}</figcaption></figure>`).join("")}</div>
      <h2>키퍼 3안 (대기 · 왼쪽 · 오른쪽 · 점프)</h2><div class="row">${["A", "B", "C"].map((k) => `<figure class="card keeperc" style="margin:0"><div class="keeper-row">${["ready", "dive_a", "dive_b", "jump"].map((n) => `<img src="${file(k, n)}">`).join("")}</div><figcaption>${k} · ${DESC.keeper[k]}</figcaption></figure>`).join("")}</div>`;
  }

  const tm = document.getElementById("t-m"), tp = document.getElementById("t-p");
  function setView(pc) { document.body.classList.toggle("view-pc", pc); tm.setAttribute("aria-pressed", String(!pc)); tp.setAttribute("aria-pressed", String(pc)); }
  tm.onclick = () => setView(false); tp.onclick = () => setView(true);
  grid();
  loadSizes().then(render);
</script>
</body>
</html>
